name: desktop

# Builds the desktop app for each platform. PyInstaller does not cross-compile,
# so the Windows .exe comes from windows-latest, the .app from macos-latest.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app and the packager
        run: pip install ".[desktop,build]"

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      # The Linux window is pywebview's GTK backend, and PyGObject, GTK 3 and WebKit2GTK come from
      # apt rather than pip. Without them the bundle still builds — the self test is headless — but
      # it has no window to show, and PyInstaller reports "Typelib file for namespace 'Gtk' not
      # found" and leaves the GTK half out. 4.1 is in Ubuntu 24.04, 4.0 in 22.04.
      - name: GTK 3 and WebKit2GTK (Linux window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 ||
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libwebkit2gtk-4.0-37

      - name: Fetch the models into the cache
        run: python -c "from indra_ocr.models import model_dir; print(model_dir(math=True))"

      - name: Build, self-test and make the installer (Windows)
        # A release build: no console window behind the GUI. build.py still gates
        # on `--selftest`'s exit code, which needs no stdout.
        if: runner.os == 'Windows'
        run: python packaging/build.py --console 0 --installer

      - name: Build, self-test and make the .dmg (macOS)
        if: runner.os == 'macOS'
        run: python packaging/build.py --console 0 --dmg

      - name: Build and self-test
        if: runner.os == 'Linux'
        run: python packaging/build.py --console 0

      # --selftest is headless, so it cannot see a missing GTK or WebKit2: a Linux
      # bundle with no window shipped that way. xvfb gives the real window a
      # display, the app closes it again and exits non-zero if it never opened.
      - name: The window really opens (Linux)
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            dist/IndraOCR/IndraOCR --windowtest

      # Signing: the certificates are secrets, so these steps only run when one is
      # configured (`secrets.WINDOWS_CERT` etc.). A signed exe and setup.exe stop
      # SmartScreen from warning on first run.
      # - name: Sign (Windows)
      #   if: runner.os == 'Windows' && env.WINDOWS_CERT != ''
      #   env:
      #     WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
      #   run: |
      #     echo "$env:WINDOWS_CERT" | certutil -decode -f - cert.pfx
      #     signtool sign /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /fd sha256 `
      #       /tr http://timestamp.digicert.com /td sha256 /a dist\IndraOCR\IndraOCR.exe
      #     del cert.pfx

      # - name: Sign the installer (Windows)
      #   if: runner.os == 'Windows' && env.WINDOWS_CERT != ''
      #   run: ... signtool ... dist\IndraOCR-*-setup.exe

      # - name: Sign and notarise (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     codesign --deep --force --options runtime --sign "Developer ID Application: ..." dist/IndraOCR.app
      #     xcrun notarytool submit ... --wait
      #     xcrun stapler staple dist/IndraOCR.app

      # The folder is what you ship, and a zip or a tarball is how a user gets it
      # without losing the executable bit on Linux (upload-artifact's own zip
      # drops it). The name carries the version, so a release asset says what it is.
      - name: Pack the folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          Compress-Archive -Path dist\IndraOCR -DestinationPath "dist\IndraOCR-$v-windows-x64.zip"

      - name: Pack the folder (Linux)
        if: runner.os == 'Linux'
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tar -czf "dist/IndraOCR-$v-linux-x64.tar.gz" -C dist IndraOCR

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: IndraOCR-windows-x64
          path: dist/IndraOCR-*-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: IndraOCR-linux-x64
          path: dist/IndraOCR-*-linux-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: IndraOCR-windows-setup
          # the setup and the .sha256 build.py writes beside it
          path: dist/IndraOCR-*-setup.exe*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: IndraOCR-macos-dmg
          path: dist/IndraOCR-*.dmg*
          if-no-files-found: error

  # A tag puts the four artifacts on a GitHub Release, which is the only place a
  # user can download them without an account and after 90 days. Everything here
  # says "fork build": the code is Apache-2.0 and redistributable, the weights are
  # under the modified OpenRAIL-M, and the bundles carry both texts.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # A fork's GITHUB_TOKEN is read-only by default: without this the release is a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Collect the assets
        run: |
          mkdir -p out
          find assets -type f \( -name '*.zip' -o -name '*.tar.gz' \
            -o -name '*.exe' -o -name '*.dmg' -o -name '*.sha256' \) -exec cp {} out/ \;
          ls -l out
          (cd out && sha256sum * > SHA256SUMS)

      - name: Release notes
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          python3 - "$v" > notes.md <<'PY'
          import os
          import sys
          from pathlib import Path

          version = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF_NAME"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          out, inside = [], False
          for line in lines:
              if line.startswith("## "):
                  if out:
                      break
                  inside = line.strip() == f"## {version}"
                  continue
              if inside:
                  out.append(line)
          body = "\n".join(out).strip() or "See CHANGELOG.md."

          print(
              f"""**Unofficial fork build.** These files come from a fork of
          [datalab-to/indra](https://github.com/datalab-to/indra), built from the commit this tag
          points at. They are not a release by Datalab, and Datalab does not support them: the
          desktop app, the installer and the `.dmg` are this fork's work, the models are upstream's.

          | file | what it is |
          | --- | --- |
          | `IndraOCR-{version}-windows-x64.zip` | the app, unpack and run `IndraOCR.exe` |
          | `IndraOCR-{version}-setup.exe` | the same, as an installer; `.sha256` beside it |
          | `IndraOCR-{version}-linux-x64.tar.gz` | `tar xzf`, then `./IndraOCR/IndraOCR` (needs `libwebkit2gtk-4.1-0` for the window) |
          | `IndraOCR-{version}.dmg` | macOS: open and drag to Applications; `.sha256` beside it |
          | `SHA256SUMS` | every digest above, in `sha256sum` format |

          The code is Apache-2.0 and the model weights are under the modified OpenRAIL-M. Both texts
          are in the bundle (`LICENSE`, `MODELS-LICENSE.txt`) and the installer shows
          [THIRD-PARTY-NOTICES.md](https://github.com/{repo}/blob/{ref}/THIRD-PARTY-NOTICES.md),
          which also says what this fork changed. Read the weights licence before commercial use.

          ## Changes in {version}

          {body}"""
          )
          PY
          head -12 notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Indra OCR ${GITHUB_REF_NAME} (unofficial fork build)" \
            --notes-file notes.md \
            out/*
